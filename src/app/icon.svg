<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="giroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo Squircle Laranja Giro -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#giroGrad)" filter="url(#glow)"/>

  <!-- Seta Circular Externa -->
  <path d="M32 14 C22.06 14 14 22.06 14 32 C14 41.94 22.06 50 32 50 C41.94 50 50 41.94 50 32 C50 26.5 47.5 21.6 43.6 18.3" 
        fill="none" 
        stroke="#0f172a" 
        stroke-width="5" 
        stroke-linecap="round"/>
        
  <!-- Ponta da Seta -->
  <path d="M43 11 L43 20 L34 20" 
        fill="none" 
        stroke="#0f172a" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Teto da Loja / Toldinho -->
  <path d="M23 27 L41 27 L42 33 L22 33 Z" fill="#0f172a"/>
  
  <!-- Corpo da Loja -->
  <path d="M24 33 L24 41 L40 41 L40 33" 
        fill="none" 
        stroke="#0f172a" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>

